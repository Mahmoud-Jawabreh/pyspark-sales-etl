app:
  name: pyspark-sales-etl

spark:
  master: "local[2]"
  shuffle_partitions: 8
  adaptive_enabled: true

quality:
  max_rejected_ratio: 0.50

paths:
  sales_input: "/opt/project/data/sales_batch_input.csv"

  batch_sales_output: "/opt/spark-output/batch/sales_clean"

  bronze_sales: "/opt/spark-output/delta/bronze_sales"
  silver_sales: "/opt/spark-output/delta/silver_sales"
  quarantine_sales: "/opt/spark-output/delta/quarantine_stream_sales"

  bronze_sales_cdc: "/opt/spark-output/delta/bronze_sales_cdc"
  silver_sales_cdc: "/opt/spark-output/delta/silver_sales_cdc_safe"

  dim_customer: "/opt/spark-output/delta/dim_customer_scd2"
  dim_product: "/opt/spark-output/delta/dim_product"

  fact_sales: "/opt/spark-output/delta/fact_sales_gold"

  checkpoints_root: "/opt/spark-output/checkpoints"